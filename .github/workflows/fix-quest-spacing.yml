name: Fix quest spacing
on:
  push:
    paths:
      - '.github/workflows/fix-quest-spacing.yml'
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update quest spacing
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '.questbar{margin-top:-42px;position:relative;z-index:4}'
          new = '.questbar{margin-top:42px;position:relative;z-index:4}'
          if old not in s:
              raise SystemExit('target rule not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit updated page
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Fix quest card spacing'
          git push
