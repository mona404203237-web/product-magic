<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>产品魔法冒险｜Product Magic Adventure</title>
<script>
(async()=>{
  try{
    const base='https://raw.githubusercontent.com/mona404203237-web/product-magic/main/.deploy_upload/part-';
    const bust='?v=20260820-0715';
    const urls=Array.from({length:8},(_,i)=>base+String(i+1).padStart(2,'0')+'.b64'+bust);
    const parts=await Promise.all(urls.map(u=>fetch(u,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('load '+u);return r.text()})));
    const b64=parts.join('').replace(/\s/g,'');
    const bin=atob(b64);
    const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
    const html=new TextDecoder('utf-8').decode(bytes);
    document.open();document.write(html);document.close();
  }catch(e){
    document.body.innerHTML='<div style="font-family:Arial,sans-serif;padding:48px;color:#0D1B34">页面正在更新，请稍后刷新。</div>';
    console.error(e);
  }
})();
</script>
</head>
<body></body>
</html>
