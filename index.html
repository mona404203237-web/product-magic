<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>产品魔法冒险｜Product Magic Adventure</title>
<script>
(async()=>{
  try{
    const url='https://raw.githubusercontent.com/mona404203237-web/product-magic/4d8a95272a745d0289b409ac7075d56fc4714244/index.html?v=20260820-1503';
    const r=await fetch(url,{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    let html=await r.text();
    const patch=`<style>
/* Hero 背景延展修复：保留原页面内容与样式，只修复圆环底部背景断层 */
.hero{padding-bottom:140px !important;}
.questbar{margin-top:0 !important;transform:translateY(-36px);}
@media(max-width:980px){.hero{padding-bottom:125px !important}.questbar{margin-top:0 !important;transform:translateY(-28px)}}
@media(max-width:680px){.hero{padding-bottom:105px !important}.questbar{margin-top:0 !important;transform:translateY(-20px)}}
</style>`;
    html=html.replace('</head>',patch+'\n</head>');
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    console.error(e);
    document.body.innerHTML='<main style="font-family:Inter,PingFang SC,Microsoft YaHei,Arial,sans-serif;max-width:760px;margin:80px auto;padding:32px;color:#0D1B34"><h2>魔法之门正在重新开启 ✨</h2><p>请刷新页面。</p></main>';
  }
})();
</script>
</head>
<body></body>
</html>
